<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kamis Wage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Playfair Display", serif;
        }

        body {
            overflow: hidden;
            background: #000;
            color: #f5e6c8;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .overlay {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 215, 150, 0.25);
            border-radius: 18px;
            padding: 2rem 2.5rem;
            max-width: 420px;
            width: 100%;
        }

        .names {
            font-size: clamp(2rem, 6vw, 2.8rem);
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .divider {
            margin: 1rem auto;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, gold, transparent);
        }

        .details {
            font-size: 1rem;
            line-height: 1.7;
            opacity: 0.9;
        }

        .date {
            margin-top: 1rem;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            color: #ffd27d;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.6rem;
            }
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
<div class="overlay">
    <div class="card">
        <div class="names">Rutinan Kamis Wage</div>
        <div class="divider"></div>
        <div class="details">
            Rutinan Kamis Wage setiap 35 hari sekali
        </div>
        <div class="date">
            2 • April • 2026<br/>
            Sumberagung, Klego
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    import {RGBELoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/RGBELoader.js";

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );
    camera.position.set(0, 0.4, 3);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;

    new RGBELoader()
        .setPath("https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/")
        .load("studio_small_09_1k.hdr", (hdr) => {
            hdr.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = hdr;
        });

    const geometry = new THREE.TorusGeometry(0.9, 0.18, 128, 256);
    const goldMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(1.0, 0.766, 0.336),
        metalness: 1.0,
        roughness: 0.18,
        clearcoat: 0.12,
        clearcoatRoughness: 0.25,
        reflectivity: 0.9,
        ior: 0.47
    });
    const ring = new THREE.Mesh(geometry, goldMaterial);
    ring.rotation.x = Math.PI / 2.2;
    scene.add(ring);
    const light = new THREE.DirectionalLight(0xffffff, 0.6);
    light.position.set(5, 5, 5);
    scene.add(light);
    const clock = new THREE.Clock();

    function animate() {
        const t = clock.getElapsedTime();
        ring.position.y = Math.sin(t * 0.8) * 0.08;
        ring.rotation.x = Math.PI / 2.2 + Math.sin(t * 0.6) * 0.05;
        ring.rotation.z += 0.001;
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
